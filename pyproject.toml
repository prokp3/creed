[project]
name = "creed"
version = "0.1.0"
description = "A personal triathlon dashboard built from your own Garmin data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "tzdata",
  "webauthn>=3.0.1,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pgserver>=0.1.4",
  "pytest>=8",
  "ruff",
  "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["creed*"]

[tool.setuptools.package-data]
creed = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "tools"]

[tool.ruff]
line-length = 120
